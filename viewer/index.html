<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity Cube</title>
<style>
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232322;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --hairline: #2c2c2a;
    --axis: #383835;
    --accent: #3987e5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--text-primary);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { display: flex; height: 100%; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 12px;
    color: var(--text-muted); text-shadow: 0 0 3px var(--page), 0 0 3px var(--page); }
  .lbl.slice { color: var(--text-secondary); }
  #panel { width: 320px; flex: none; background: var(--surface); border-left: 1px solid var(--hairline);
    overflow-y: auto; padding: 14px 16px 24px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--text-muted); margin-bottom: 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted);
    margin: 18px 0 8px; font-weight: 600; }
  label.row { display: block; margin: 8px 0 2px; color: var(--text-secondary); }
  .val { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=text] { width: 100%; background: var(--surface-2); color: var(--text-primary);
    border: 1px solid var(--axis); border-radius: 4px; padding: 4px 6px; font: inherit; }
  .chk { display: flex; gap: 12px; flex-wrap: wrap; color: var(--text-secondary); }
  .chk label { display: flex; gap: 4px; align-items: center; }
  #legend .sw { display: inline-block; width: 22px; height: 12px; border-radius: 2px; vertical-align: middle; }
  #legend .bins { display: flex; gap: 2px; margin: 4px 0 2px; }
  #legend .bins div { flex: 1; text-align: center; color: var(--text-muted); font-size: 11px; }
  #legend .bins .sw { width: 100%; display: block; margin-bottom: 2px; }
  #legend .grad { height: 10px; border-radius: 2px; margin: 6px 0 2px; }
  #legend .ends { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 11px; }
  #legend .extra { display: flex; gap: 14px; margin-top: 8px; color: var(--text-secondary); font-size: 12px; }
  #hover { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; min-height: 92px;
    font-variant-numeric: tabular-nums; }
  #hover .k { color: var(--text-muted); display: inline-block; width: 62px; }
  #status { color: var(--text-muted); font-size: 12px; }
  #bar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 6px 0; overflow: hidden; }
  #bar div { height: 100%; width: 0; background: var(--accent); }
  .help { color: var(--text-muted); font-size: 12px; }
  .help b { color: var(--text-secondary); font-weight: 500; }
  #err { display: none; position: absolute; inset: 0; padding: 40px; color: var(--text-primary); background: var(--page); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="gpu" tabindex="0"></canvas>
    <div id="labels"></div>
    <div id="err"></div>
  </div>
  <div id="panel">
    <h1>Unity Cube</h1>
    <div class="sub">Numerai v6.0</div>
    <div id="status">starting…</div>
    <div id="bar"><div></div></div>

    <h2>Hover</h2>
    <div id="hover"><span class="help">Hover a slice to read a cell</span></div>

    <h2>Slices</h2>
    <label class="row">Date (Z) <span class="val" id="dateLbl"></span></label>
    <input type="range" id="date" min="0" max="0" value="0">
    <label class="row">Feature / target (Y) <span class="val" id="colLbl"></span></label>
    <input type="range" id="col" min="0" max="0" value="0">
    <select id="colSel"></select>
    <label class="row">Ticker (X) <span class="val" id="tickLbl"></span></label>
    <input type="range" id="tick" min="0" max="0" value="0">
    <input type="text" id="tickSearch" list="tickList" placeholder="jump to ticker…" autocomplete="off">
    <datalist id="tickList"></datalist>
    <div class="chk" style="margin-top:10px">
      <label><input type="checkbox" id="showDate" checked> date</label>
      <label><input type="checkbox" id="showCol" checked> feature</label>
      <label><input type="checkbox" id="showTick" checked> ticker</label>
    </div>

    <h2>Layout</h2>
    <label class="row">Ticker order</label>
    <select id="order">
      <option value="first">first appearance</option>
      <option value="country">country, then first appearance</option>
      <option value="alpha">alphabetical</option>
    </select>
    <div class="chk" style="margin-top:10px">
      <label><input type="checkbox" id="hideEmpty"> hide empty cells</label>
    </div>
    <label class="row">Zoomed-out quality <span class="val" id="qualLbl"></span></label>
    <input type="range" id="quality" min="1" max="8" value="5">

    <h2>Colour</h2>
    <div id="legend"></div>

    <h2>Controls</h2>
    <div class="help">
      <b>drag</b> orbit · <b>right/shift-drag</b> pan · <b>wheel</b> zoom to cursor<br>
      <b>ctrl-drag</b> on a slice moves it along its axis<br>
      <b>[ ]</b> date · <b>, .</b> ticker · <b>; '</b> feature (hold shift ×10) · <b>r</b> reset view
    </div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
